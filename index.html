<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Finanzas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--b:#efe6d2;--t:#4a4036;--N:#cfe8ee;--D:#fde3cc;--A:#d6efd0;--fijos:#f6d3d3;--deudas:#d3e0f7;--var:#e1d8f0;--deseos:#fde3cc;--ahorro:#d6efd0}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#faf7f1;color:var(--t)}
.w{max-width:1320px;margin:auto;padding:10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
button,select,input{font:inherit;padding:6px 10px;border:1px solid #d8cdb8;border-radius:8px;background:#fff;color:inherit;max-width:100%}
button{cursor:pointer}button.on,button.p{background:#8c7a5b;color:#fff;border-color:#8c7a5b}
.g{display:grid;gap:10px;margin-bottom:10px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.c{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px #0001;overflow-x:auto}
.big{text-align:center;border-radius:16px;padding:16px;background:var(--b);font-size:17px}.big b{display:block;font-size:30px;margin-top:4px}
table{width:100%;border-collapse:collapse}th{padding:5px;text-align:left;background:#0000000a}td{padding:4px 5px;border-top:1px solid #0001}.r{text-align:right}
.hd{margin:-12px -12px 8px;padding:8px 12px;border-radius:14px 14px 0 0;font-weight:700;text-align:center}
.bp{height:8px;background:#0001;border-radius:5px;overflow:hidden;margin-top:6px}.bp i{display:block;height:100%;background:#8c7a5b}
.pc{border-radius:16px;padding:14px;text-align:center}.pc b{font-size:22px;display:block}.pc input{width:64px;text-align:center}
.cv{position:relative;height:250px}.bad{color:#b3412f;font-weight:700}
#auth{max-width:340px;margin:12vh auto;display:grid;gap:8px;text-align:center}
dialog{border:0;border-radius:16px;padding:18px;width:min(380px,94vw)}dialog label{display:block;margin:6px 0 2px}dialog input,dialog select{width:100%}
.ei{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0;align-items:center}.ei input,.ei select{width:auto;max-width:130px}
</style></head><body>
<div id="auth">
<h2>Mis Finanzas</h2>
<button class="p" onclick="login()" style="padding:12px">Entrar con Google</button><div id="ae" class="bad"></div></div>
<div class="w" id="app" style="display:none"><div id="main"></div></div>

<dialog id="dg"><h3 style="margin:0">Nuevo movimiento</h3>
<label>Fecha</label><input type="date" id="f">
<label>Categoría</label><select id="ca" onchange="dl()"></select>
<label>Concepto</label><input id="co" list="cl"><datalist id="cl"></datalist>
<label>Detalle (opcional)</label><input id="dt">
<label>Monto real</label><input id="mo" type="number" step="0.01" inputmode="decimal">
<div style="margin-top:12px;display:flex;gap:8px"><button class="p" onclick="save()">Guardar</button><button onclick="dg.close()">Cancelar</button></div></dialog>

<script>
/* ===== 1) PEGA AQUÍ TU firebaseConfig (el mismo que ya usas) ===== */
const firebaseConfig={
  apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""
};
/* ================================================================= */
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];
/* Cada cuadro define su tipo 50/30/20: N=Necesidades, D=Deseos, A=Ahorro */
const CU=[{k:'fijos',n:'Gastos fijos',t:'N',f:1},{k:'deudas',n:'Deudas',t:'N',f:1},{k:'var',n:'Gastos variables',t:'N'},{k:'deseos',n:'Deseos',t:'D'},{k:'ahorro',n:'Ahorros',t:'A'}];
const TT={N:'Necesidades',D:'Deseos',A:'Ahorro'};
const COL={fijos:'#f2b5b5',deudas:'#a9c1ee',var:'#c9b8e6',deseos:'#f7c99b',ahorro:'#a8dba0'};
const DEF={ini:1,dm:1,pct:{N:50,D:30,A:20},ing:['Sueldo','Emprendimiento','Alquiler','Otros'],it:{
fijos:[{n:'Renta',m:0,fr:'m',d:1,on:1},{n:'Luz',m:0,fr:'m',d:15,on:1},{n:'Celular',m:35,fr:'m',d:18,on:1}],
deudas:[{n:'Tarjeta de crédito',m:0,fr:'m',d:10,on:1}],
var:['Mercado','Transporte','Salud','Hogar','Mascotas','Otros'].map(n=>({n,p:0})),
deseos:['Restaurantes','Entretenimiento','Ropa','Vacaciones','Regalos'].map(n=>({n,p:0})),
ahorro:[{n:'Ahorro',p:0}]}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00'),add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const days=(a,b)=>Math.round((pd(b)-pd(a))/864e5)+1;
const $=n=>'S/ '+(+n||0).toLocaleString('es-PE',{maximumFractionDigits:2});
const P=(x,t)=>t>0?Math.round(x/t*100)+'%':'0%';
const g=id=>document.getElementById(id);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
let S={cfg:JSON.parse(JSON.stringify(DEF)),mov:[],v:'s',ref:iso(new Date()),r:null,sc:'var',eo:0,u:null},CH=[],UN=[];
const col=()=>db.collection('users').doc(S.u.uid).collection('mov');
const cref=()=>db.collection('users').doc(S.u.uid).collection('cfg').doc('main');
const saveCfg=()=>cref().set(S.cfg);

/* ---------- Auth ---------- */
const aerr=e=>g('ae').textContent=e.message;
function login(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{if(e.code=='auth/popup-blocked'||e.code=='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());else aerr(e)})}
auth.onAuthStateChanged(u=>{S.u=u;UN.forEach(f=>f());UN=[];g('auth').style.display=u?'none':'grid';g('app').style.display=u?'block':'none';if(!u)return;
UN.push(cref().onSnapshot(s=>{if(s.exists){const c=s.data();S.cfg={...DEF,...c,pct:{...DEF.pct,...c.pct},it:{...DEF.it,...c.it}}}else saveCfg();render()}));
UN.push(col().onSnapshot(s=>{S.mov=s.docs.map(d=>({id:d.id,...d.data()}));render()}))});

/* ---------- Periodo (semana / mes / año, editable) ---------- */
function rng(){if(S.r)return S.r;const d=pd(S.ref);
if(S.v=='s'){const a=add(d,-((d.getDay()-S.cfg.ini+7)%7));return[iso(a),iso(add(a,6))]}
if(S.v=='m'){const m=S.cfg.dm;let a=new Date(d.getFullYear(),d.getMonth(),m);if(a>d)a=new Date(d.getFullYear(),d.getMonth()-1,m);return[iso(a),iso(add(new Date(a.getFullYear(),a.getMonth()+1,m),-1))]}
return[d.getFullYear()+'-01-01',d.getFullYear()+'-12-31']}
function shift(n){const[a]=rng(),d=pd(a);S.r=null;S.ref=S.v=='s'?iso(add(d,7*n)):S.v=='m'?iso(new Date(d.getFullYear(),d.getMonth()+n,S.cfg.dm)):(d.getFullYear()+n)+'-06-01';render()}
function occ(x,a,b){if(!x.on)return 0;if(x.fr=='s')return Math.max(1,Math.round(days(a,b)/7));let c=0;
for(let d=pd(a);d<=pd(b);d=add(d,1))if(d.getDate()==Math.min(x.d,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))c++;return c}

/* ---------- Render ---------- */
function render(){if(!S.u)return;
const[a,b]=rng(),W=days(a,b)/7,M=S.mov.filter(x=>x.fecha>=a&&x.fecha<=b);
const ing=M.filter(x=>x.tipo=='Ingreso'),eg=M.filter(x=>x.tipo=='Egreso');
const T=l=>l.reduce((s,x)=>s+x.monto,0),I=T(ing),E=T(eg);
const cc={},tc={},ti={};eg.forEach(x=>{cc[x.categoria+'|'+x.concepto]=(cc[x.categoria+'|'+x.concepto]||0)+x.monto;tc[x.categoria]=(tc[x.categoria]||0)+x.monto});
ing.forEach(x=>ti[x.concepto]=(ti[x.concepto]||0)+x.monto);
const tp={N:0,D:0,A:0};CU.forEach(c=>tp[c.t]+=tc[c.n]||0);
const rt=(h,rows,tot)=>`<table><tr><th>${h}</th><th class=r>%</th><th class=r>Monto</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td class=r>${P(r[1],tot)}</td><td class=r><b>${$(r[1])}</b></td></tr>`).join('')}<tr><td><b>Total</b></td><td class=r>${tot?'100%':'0%'}</td><td class=r><b>${$(tot)}</b></td></tr></table>`;
const inames=[...new Set([...S.cfg.ing,...Object.keys(ti)])];
const lab=S.r?'Personalizado':S.v=='s'?'Semana':S.v=='m'?MES[add(pd(a),15).getMonth()]:'Año '+a.slice(0,4);
const blk=c=>{const it=S.cfg.it[c.k],nm=it.map(x=>x.n),ex=[...new Set(eg.filter(x=>x.categoria==c.n&&!nm.includes(x.concepto)).map(x=>x.concepto))];let rows='',sp=0,sa=0;
if(c.f){it.forEach((x,i)=>{const o=occ(x,a,b);if(!o)return;const pr=o*x.m,pg=cc[c.n+'|'+x.n]||0;sp+=pr;sa+=pg;
rows+=`<tr><td>${x.n}</td><td class=r>${$(pr)}</td><td>${x.fr=='s'?'Semanal':'Día '+x.d}</td><td>${pg>=pr&&pg>0?'✔ Pagado':`<button onclick="pay('${c.k}',${i})">Pagar</button>`}${pg&&pg<pr?' ('+$(pg)+')':''}</td></tr>`});
ex.forEach(n=>{sa+=cc[c.n+'|'+n];rows+=`<tr><td>${n}</td><td class=r>—</td><td></td><td>${$(cc[c.n+'|'+n])}</td></tr>`});
return`<div class=c><div class=hd style="background:var(--${c.k})">${c.n}</div><table><tr><th>Concepto</th><th class=r>Monto</th><th>Vence</th><th>Estado</th></tr>${rows}<tr><td><b>Total</b></td><td class=r><b>${$(sp)}</b></td><td></td><td><b>${$(sa)}</b></td></tr></table></div>`}
const all=[...it.map(x=>[x.n,x.p*W]),...ex.map(n=>[n,0])];
all.forEach(([n,pr])=>{const ac=cc[c.n+'|'+n]||0;sp+=pr;sa+=ac;rows+=`<tr><td>${n}</td><td class=r>${$(pr)}</td><td class="r ${pr>0&&ac>pr?'bad':''}">${$(ac)}</td></tr>`});
const ah=c.k=='ahorro';
return`<div class=c><div class=hd style="background:var(--${c.k})">${c.n}</div><table><tr><th>Concepto</th><th class=r>${ah?'Meta':'Presupuesto'}</th><th class=r>${ah?'Ahorrado':'Actual'}</th></tr>${rows}<tr><td><b>Total</b></td><td class=r><b>${$(sp)}</b></td><td class=r><b>${$(sa)}</b></td></tr></table></div>`};
const pcs=['N','D','A'].map(t=>{const pr=I*S.cfg.pct[t]/100,u=tp[t];return`<div class=pc style="background:var(--${t})"><div>${TT[t]} <input type=number value="${S.cfg.pct[t]}" onchange="setPct('${t}',this.value)">%</div><b>${$(pr)}</b><div>Gastado: ${$(u)} ${u>pr&&pr>0?'<span class=bad>(excedido)</span>':''}</div><div class=bp><i style="width:${pr?Math.min(100,u/pr*100):0}%"></i></div></div>`}).join('');
const ps=S.cfg.pct.N+S.cfg.pct.D+S.cfg.pct.A;
let yr='';if(S.v=='y'){const y=+a.slice(0,4);yr=`<div class=c><div class=hd style="background:var(--b)">Dashboard anual ${y}</div><table><tr><th>Mes</th><th class=r>Ingresos</th><th class=r>Egresos</th><th class=r>Ahorro</th><th class=r>Restante</th></tr>${MES.map((m,i)=>{const l=S.mov.filter(x=>x.fecha.slice(0,7)==y+'-'+String(i+1).padStart(2,'0')),ii=T(l.filter(x=>x.tipo=='Ingreso')),ee=T(l.filter(x=>x.tipo=='Egreso')),aa=T(l.filter(x=>x.categoria=='Ahorros'));return`<tr><td>${m}</td><td class=r>${$(ii)}</td><td class=r>${$(ee)}</td><td class=r>${$(aa)}</td><td class=r><b>${$(ii-ee)}</b></td></tr>`}).join('')}</table></div>`}
const ml=[...M].sort((x,y)=>x.fecha<y.fecha?1:-1).map(x=>`<tr><td>${x.fecha}</td><td>${x.categoria}</td><td>${x.concepto}</td><td>${x.detalle||''}</td><td class=r>${x.tipo=='Ingreso'?'+':'−'}${$(x.monto)}</td><td><button onclick="del('${x.id}')">✕</button></td></tr>`).join('');
const edit=CU.map(c=>`<h4>${c.n} <small>(${TT[c.t]})</small></h4>`+S.cfg.it[c.k].map((x,i)=>`<div class=ei><input value="${x.n}" onchange="ed('${c.k}',${i},'n',this.value)">${c.f?`<input type=number placeholder="Monto" value="${x.m}" onchange="ed('${c.k}',${i},'m',+this.value)"><select onchange="ed('${c.k}',${i},'fr',this.value)"><option value=m ${x.fr=='m'?'selected':''}>Mensual</option><option value=s ${x.fr=='s'?'selected':''}>Semanal</option></select>${x.fr=='m'?`<input type=number min=1 max=31 style="width:70px" value="${x.d}" onchange="ed('${c.k}',${i},'d',+this.value)" title="Día de vencimiento">`:''}<label><input type=checkbox ${x.on?'checked':''} onchange="ed('${c.k}',${i},'on',this.checked?1:0)">Activo</label>`:`<input type=number placeholder="Presupuesto semanal" value="${x.p}" onchange="ed('${c.k}',${i},'p',+this.value)">`}<button onclick="rm('${c.k}',${i})">Quitar</button></div>`).join('')+`<button onclick="addI('${c.k}')">+ Agregar</button>`).join('');
g('main').innerHTML=`
<div class=bar>${[['s','Semana'],['m','Mes'],['y','Año']].map(([k,n])=>`<button class="${S.v==k&&!S.r?'on':''}" onclick="S.v='${k}';S.r=null;render()">${n}</button>`).join('')}
<button onclick="shift(-1)">◀</button><input type=date value="${a}" onchange="S.r=[this.value,'${b}'];render()"><input type=date value="${b}" onchange="S.r=['${a}',this.value];render()"><button onclick="shift(1)">▶</button>
<button onclick="S.r=null;S.ref=iso(new Date());render()">Hoy</button>
<span style="flex:1"></span><button class=p onclick="nuevo()">+ Movimiento</button>
<button onclick="g('fx').click()">Importar Excel</button><input type=file id=fx accept=".xlsx,.xlsm,.xls" hidden onchange="imp(this.files[0]);this.value=''"><button onclick="exp()">Exportar Excel</button><button onclick="auth.signOut()">Salir</button></div>
<div class=g><div class=c style="background:var(--b)"><div>Moneda: S/.</div><div style="font-size:22px;font-weight:700">${lab}</div><div>${a} a ${b}</div><div class=big style="background:#c9b99a;margin-top:8px">Dinero restante<b>${$(I-E)}</b></div></div>
<div class=big>Ingresos totales<b>${$(I)}</b></div><div class=big style="background:#f3ede0">Egresos totales<b>${$(E)}</b></div></div>
<div class=g><div class=c><div class=hd style="background:var(--b)">Resumen ingresos</div>${rt('Categoría',inames.map(n=>[n,ti[n]||0]),I)}</div>
<div class=c><div class=hd style="background:var(--b)">Resumen egresos</div>${rt('Categoría',CU.map(c=>[c.n,tc[c.n]||0]),E)}</div></div>
<div class=c style="margin-bottom:10px"><div class=hd style="background:#fdeebb">Presupuesto 50/30/20 ${ps!=100?'<span class=bad>(suma '+ps+'%)</span>':''}</div><div class=g style="margin:0">${pcs}</div></div>
<div class=g><div class=c><div class=cv><canvas id=c1></canvas></div></div><div class=c><div class=cv><canvas id=c2></canvas></div></div><div class=c><div class=cv><canvas id=c3></canvas></div></div>
<div class=c><select onchange="S.sc=this.value;render()">${CU.map(c=>`<option value=${c.k} ${S.sc==c.k?'selected':''}>${c.n}</option>`).join('')}</select><div class=cv style="height:210px"><canvas id=c4></canvas></div></div>
<div class=c><div class=cv><canvas id=c5></canvas></div></div></div>
${yr?`<div class=g style="grid-template-columns:1fr">${yr}</div>`:''}
<div class=g>${CU.map(blk).join('')}</div>
<div class=c style="margin-bottom:10px"><div class=hd style="background:var(--b)">Movimientos del periodo (${M.length})</div><table><tr><th>Fecha</th><th>Categoría</th><th>Concepto</th><th>Detalle</th><th class=r>Monto</th><th></th></tr>${ml||'<tr><td colspan=6>Sin movimientos. Toca “+ Movimiento” o importa tu Excel.</td></tr>'}</table></div>
<details class=c ${S.eo?'open':''} ontoggle="S.eo=this.open"><summary><b>Editar cuadros y ajustes</b></summary>
<div class=ei style="margin-top:8px">Primer día de la semana: <select onchange="S.cfg.ini=+this.value;saveCfg()">${['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'].map((n,i)=>`<option value=${i} ${S.cfg.ini==i?'selected':''}>${n}</option>`).join('')}</select>
Mes empieza el día: <input type=number min=1 max=28 style="width:70px" value="${S.cfg.dm}" onchange="S.cfg.dm=+this.value||1;saveCfg()"></div>
<div class=ei>Conceptos de ingreso (separados por coma): <input style="max-width:420px;width:100%" value="${S.cfg.ing.join(', ')}" onchange="S.cfg.ing=this.value.split(',').map(s=>s.trim()).filter(Boolean);saveCfg()"></div>${edit}</details>`;
CH.forEach(c=>c.destroy());CH=[];
const mk=(id,cfg)=>CH.push(new Chart(g(id),cfg)),o=(t,x={})=>({responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:t},legend:{display:!!x.l,position:'bottom'}},...x.o});
mk('c1',{type:'bar',data:{labels:['Ingreso','Egreso'],datasets:[{data:[I,E],backgroundColor:['#a8dba0','#f2b5b5']}]},options:o('Ingresos vs. Gastos')});
mk('c2',{type:'doughnut',data:{labels:CU.map(c=>c.n),datasets:[{data:CU.map(c=>tc[c.n]||0),backgroundColor:CU.map(c=>COL[c.k])}]},options:o('Distribución de gastos',{l:1})});
const pe=I?Math.round(E/I*100):0;
mk('c3',{type:'doughnut',data:{datasets:[{data:[Math.min(pe,100),Math.max(0,100-pe)],backgroundColor:[pe>90?'#f2b5b5':pe>70?'#f7c99b':'#a8dba0','#eee']}]},options:o('% Egresos / Ingresos: '+pe+'%',{o:{rotation:-90,circumference:180,cutout:'65%'}})});
const k4=CU.find(c=>c.k==S.sc),i4=S.cfg.it[S.sc];
mk('c4',{type:'bar',data:{labels:i4.map(x=>x.n),datasets:[{label:'Presupuesto',data:i4.map(x=>k4.f?occ(x,a,b)*x.m:x.p*W),backgroundColor:'#d8cdb8'},{label:'Actual',data:i4.map(x=>cc[k4.n+'|'+x.n]||0),backgroundColor:COL[S.sc]}]},options:o('Presupuesto utilizado por concepto',{l:1,o:{indexAxis:'y'}})});
mk('c5',{type:'doughnut',data:{labels:['Necesidades','Deseos','Ahorro'],datasets:[{data:[tp.N,tp.D,tp.A],backgroundColor:['#a9d3de','#f7c99b','#a8dba0']}]},options:o('50/30/20 real',{l:1})})}

/* ---------- Acciones ---------- */
const setPct=(t,v)=>{S.cfg.pct[t]=+v||0;saveCfg()};
const ed=(k,i,f,v)=>{S.cfg.it[k][i][f]=v;saveCfg()};
const rm=(k,i)=>{if(confirm('¿Quitar "'+S.cfg.it[k][i].n+'"? El historial se mantiene.')){S.cfg.it[k].splice(i,1);saveCfg()}};
const addI=k=>{const c=CU.find(x=>x.k==k);S.cfg.it[k].push(c.f?{n:'Nuevo',m:0,fr:'m',d:1,on:1}:{n:'Nuevo',p:0});saveCfg()};
const del=id=>{if(confirm('¿Borrar este movimiento?'))col().doc(id).delete()};
function pay(k,i){const c=CU.find(x=>x.k==k),x=S.cfg.it[k][i],[a,b]=rng(),m=prompt('Monto pagado de '+x.n,x.m);if(m===null||isNaN(+m))return;
const t=iso(new Date());col().add({fecha:t>=a&&t<=b?t:a,tipo:'Egreso',categoria:c.n,concepto:x.n,detalle:'',presupuesto:x.m,monto:+m})}
function nuevo(){const[a,b]=rng(),t=iso(new Date());g('f').value=t>=a&&t<=b?t:a;g('ca').innerHTML='<option>Ingresos</option>'+CU.map(c=>`<option>${c.n}</option>`).join('');g('ca').value='Gastos variables';g('co').value=g('dt').value=g('mo').value='';dl();g('dg').showModal()}
function dl(){const c=CU.find(x=>x.n==g('ca').value);g('cl').innerHTML=(c?S.cfg.it[c.k].map(x=>x.n):S.cfg.ing).map(n=>`<option value="${n}">`).join('')}
function save(){const f=g('f').value,m=+g('mo').value,n=g('ca').value,c=CU.find(x=>x.n==n);if(!f||!m||!g('co').value)return alert('Completa fecha, concepto y monto.');
const it=c&&S.cfg.it[c.k].find(x=>x.n==g('co').value);col().add({fecha:f,tipo:c?'Egreso':'Ingreso',categoria:n,concepto:g('co').value,detalle:g('dt').value,presupuesto:it?(it.p??it.m??0):0,monto:m});g('dg').close()}

/* ---------- Excel ---------- */
function exp(){const D=[...S.mov].sort((x,y)=>x.fecha<y.fecha?-1:1).map(x=>{const d=pd(x.fecha);return{Fecha:d,Mes:MES[d.getMonth()],'Año':d.getFullYear(),Tipo:x.tipo,'Categoría':x.categoria,Concepto:x.concepto,Detalle:x.detalle||'',Presupuesto:x.presupuesto||0,Monto:x.monto}});
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D,{cellDates:true}),'Datos');XLSX.writeFile(wb,'Finanzas_'+iso(new Date())+'.xlsx')}
function fdate(v){if(v instanceof Date)return new Date(v.getTime()+12*36e5).toISOString().slice(0,10);if(typeof v=='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
const s=String(v).trim(),m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return/^\d{4}-\d\d-\d\d/.test(s)?s.slice(0,10):null}
function mapCu(cat,con){const c=norm(cat),n=norm(con);const q=[['fij','fijos'],['deud','deudas'],['vari','var'],['deseo','deseos'],['ahorr','ahorro'],['inver','deseos']].find(x=>c.includes(x[0]));if(q)return CU.find(x=>x.k==q[1]);
for(const x of CU){if(S.cfg.it[x.k].some(i=>norm(i.n)==n||norm(i.n)==c))return x}return CU[2]}
async function imp(f){if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});let rows=[];
for(const n of wb.SheetNames){const A=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}),h=A.findIndex(r=>r.includes('Fecha')&&r.includes('Monto'));if(h<0)continue;const H=A[h];A.slice(h+1).forEach(r=>{const o={};H.forEach((k,i)=>o[k]=r[i]);rows.push(o)});break}
const L=rows.map(r=>{const fe=fdate(r.Fecha),m=+r.Monto;if(!fe||!m)return null;const ti=norm(r.Tipo).startsWith('ing');const ca=r['Categoría']||'',co=r.Concepto||ca;
if(ti)return{fecha:fe,tipo:'Ingreso',categoria:'Ingresos',concepto:String(co),detalle:String(r.Detalle||''),presupuesto:+r.Presupuesto||0,monto:m};
return{fecha:fe,tipo:'Egreso',categoria:mapCu(ca,co).n,concepto:String(co),detalle:String(r.Detalle||''),presupuesto:+r.Presupuesto||0,monto:m}}).filter(Boolean);
if(!L.length)return alert('No encontré filas con las columnas Fecha y Monto.');if(!confirm('Se importarán '+L.length+' movimientos. ¿Continuar?'))return;
for(let i=0;i<L.length;i+=400){const bt=db.batch();L.slice(i,i+400).forEach(x=>bt.set(col().doc(),x));await bt.commit()}alert('Importación lista.')}
</script></body></html>
